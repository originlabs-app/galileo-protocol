name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build tested website
        working-directory: website
        run: npm run build

      - name: Test report validation
        run: node --test scripts/check-lighthouse-reports.test.mjs

      - name: Collect three measurements per route
        run: npx --yes @lhci/cli@0.15.1 collect --config=website/lighthouserc.json

      - name: Preserve traces from the same measurements
        if: always()
        run: |
          mkdir -p .lighthouseci
          shopt -s nullglob
          assets=(*.trace.json *.devtoolslog.json)
          test "${#assets[@]}" -gt 0
          mv -- "${assets[@]}" .lighthouseci/

      - name: Verify complete measurements
        run: node scripts/check-lighthouse-reports.mjs

      - name: Assert category thresholds
        run: npx --yes @lhci/cli@0.15.1 assert --config=website/lighthouserc.json

      - name: Record tested commit
        if: always()
        run: |
          mkdir -p .lighthouseci
          git rev-parse HEAD > .lighthouseci/tested-commit.txt

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.event.pull_request.head.sha || github.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
